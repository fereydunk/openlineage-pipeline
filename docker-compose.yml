# Local half of the pipeline: a DB2 database and a self-managed Kafka Connect
# worker that connects to Confluent Cloud. The Connect worker runs the JDBC
# source connector that polls DB2 and produces to the db2-orders topic on CC.
#
# Values with ${...} are read from .env (docker compose auto-loads it).
services:

  # ── IBM Db2 (source database) ──────────────────────────────────────────────
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    platform: linux/amd64          # Db2 image is amd64; runs under emulation on Apple Silicon
    container_name: olpipe-db2
    privileged: true               # Db2 requires privileged mode
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: ${DB2_USER:-db2inst1}
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-olpipeDb2pw}
      DBNAME: ${DB2_DATABASE:-TESTDB}
      PERSISTENT_HOME: "true"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2data:/database
      - ./db2/init.sql:/tmp/init.sql:ro
    healthcheck:
      # Db2 is ready once the database is active and a trivial query succeeds.
      test: ["CMD-SHELL", "su - ${DB2_USER:-db2inst1} -c 'db2 connect to ${DB2_DATABASE:-TESTDB} >/dev/null 2>&1 && db2 \"values 1\" >/dev/null 2>&1'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 240s

  # ── Self-managed Kafka Connect worker (connects to Confluent Cloud) ─────────
  connect:
    build: ./connect
    image: olpipe-connect:latest
    container_name: olpipe-connect
    depends_on:
      - db2
    ports:
      - "8083:8083"
    environment:
      # Worker → Confluent Cloud Kafka
      CONNECT_BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      CONNECT_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";'
      # producer.* and consumer.* must carry the same security config
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";'
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";'
      # Worker internal topics live on CC (RF must be <= cluster RF of 3)
      CONNECT_GROUP_ID: olpipe-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _olpipe-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _olpipe-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _olpipe-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "3"
      # Converters: Avro values against CC Schema Registry; string keys
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: ${SR_URL}
      CONNECT_VALUE_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SR_API_KEY}:${SR_API_SECRET}
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN

volumes:
  db2data:
